<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Birthday 🎂</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #fbc2eb, #a6c1ee);
            text-align: center;
            color: white;
        }

        .container {
            margin-top: 100px;
        }

        h1 {
            font-size: 40px;
        }

        p {
            font-size: 18px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 30px;
            background-color: white;
            color: #ff69b4;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff69b4;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🎉 You’ve been invited 🎉</h1>
        <p>Welcome to my birthday world 😌</p>

        <button onclick="enterSite()">Enter if you love me 💕</button>
    </div>

    <script>
        function enterSite() {
            alert("Welcome bestie 😌✨ More coming soon...");
        }
    </script>

</body>
</html>
