<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🎉 Happy Birthday Stacy! 🎂</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Poppins&family=Pacifico&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Raleway', sans-serif;
    overflow-x: hidden;
}

/* SECTION STYLE */
.section {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;

    background-size: cover;
    background-position: center;
    color: white;
}

/* DARK OVERLAY FOR TEXT VISIBILITY */
.overlay {
    background: rgba(0,0,0,0.4);
    width: 100%;
    height: 100%;
    position: absolute;
}

/* TEXT */
h1 {
    font-family: 'Pacifico', cursive;
    font-size: 10vw;
    z-index: 2;
}

h2 {
    font-family: 'Plaifair display', serif
    font-size: 4vw;
    z-index: 2;
}

/* VIDEO */
video {
    width: 80%;
    border-radius: 20px;
    z-index: 2;
}

/* BUTTON */
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 20px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(45deg,#ff7eb3,#ffb347);
    color: white;
    cursor: pointer;
}

/* BALLOONS */
.balloon {
    position: absolute;
    bottom: -50px;
    width: 30px;
    height: 40px;
    border-radius: 50%;
    opacity: 0.8;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}
</style>
</head>

<body>
<audio id="bgmusic" loop>
    <source src="birthday-music.mp3" type="audio/mpeg">
</audio>
<!-- 🎈 SECTION 1 -->
<div class="section" style="background-image: url('20260402_093250.jpg');">

    <h1>🎉 Happy Birthday Stacy 🎉</h1>
    <h2>✨ Welcome ✨</h2>

</div>

<!-- 🎥 SECTION 2 -->
<div class="section" style="background-image: url('20260402_093250.jpg');">

    <h2>🎬 Watch This 🎬</h2>

    <video controls>
        <source src="birthday-video.mp3" type="video/mp4">
    </video>

</div>

<!-- 🎮 SECTION 3 -->
<div class="section" style="background: linear-gradient(160deg,#d2b48c,#f5f5dc); color:black;">
    <h2>🎮 Game Time</h2>
    <p>What is my favorite color?</p>
    <button class="btn" onclick="alert('Correct! 🎉')">Brown</button>
    <button class="btn" onclick="alert('Try again 😅')">Blue</button>
</div>

<!-- 🎁 SECTION 4 -->
<div class="section" style="background: linear-gradient(160deg,#f5f5dc,#d2b48c); color:black;">
    <h2>🎁 Secret</h2>
    <button class="btn" onclick="alert('You’re amazing 💖')">Click Me</button>
</div>

<!-- 🎈 BALLOONS SCRIPT -->
<script>
const colors = ['#FF6F61','#FFD700','#FF69B4','#00CED1','#FFB347'];

for (let i = 0; i < 25; i++) {
    let b = document.createElement('div');
    b.className = 'balloon';
    b.style.left = Math.random()*100 + 'vw';
    b.style.background = colors[Math.floor(Math.random()*colors.length)];
    b.style.animationDuration = (5 + Math.random()*5) + 's';
    document.body.appendChild(b);
}
</script>

</body>
</html>

    <!-- Secret Section -->
    <div id="secret" class="section">
        <h2>🎁 Secret Surprises</h2>
        <p>Here’s a hidden surprise just for you! ✨</p>
    </div>

    <!-- Support Section -->
    <div id="support" class="section">
        <h2>💸 Support Me</h2>
        <p>If you want to contribute to my birthday fun, click below!</p>
        <button class="btn">Donate</button>
    </div>

    <!-- Confetti -->
    <script>
        const colors = ['#FF6F61', '#FFD700', '#FF69B4', '#00CED1', '#FFB347'];
        for (let i = 0; i < 70; i++) {
            let conf = document.createElement('div');
            conf.style.position = 'absolute';
            conf.style.width = conf.style.height = (5 + Math.random() * 12) + 'px';
            conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            conf.style.left = Math.random() * window.innerWidth + 'px';
            conf.style.top = Math.random() * window.innerHeight + 'px';
            conf.style.opacity = 0.9;
            conf.style.transform = `rotate(${Math.random() * 360}deg)`;
            conf.style.animation = `fall ${2 + Math.random() * 3}s linear infinite`;
            document.body.appendChild(conf);
        }

        document.head.innerHTML += `
        <style>
            @keyframes fall {
                0% { transform: translateY(0); opacity:1; }
                100% { transform: translateY(100vh); opacity:0; }
            }
        </style>`;
    </script>

    <!-- Bouncing Balloons -->
    <script>
        const balloonColors = ['#FF6F61', '#FFD700', '#FF69B4', '#00CED1', '#FFB347'];

        function createBalloon() {
            const balloon = document.createElement('div');
            balloon.style.position = 'absolute';
            balloon.style.bottom = Math.random() * 20 + 'px';
            balloon.style.left = Math.random() * window.innerWidth + 'px';
            balloon.style.width = balloon.style.height = (30 + Math.random() * 40) + 'px';
            balloon.style.backgroundColor = balloonColors[Math.floor(Math.random() * balloonColors.length)];
            balloon.style.borderRadius = '50%';
            balloon.style.opacity = 0.9;
            balloon.style.animation = `bounce ${(3 + Math.random() * 3)}s ease-in-out infinite alternate`;
            document.body.appendChild(balloon);
        }

        setInterval(createBalloon, 500);

        document.head.innerHTML += `
        <style>
            @keyframes bounce {
                0% { transform: translateY(0); }
                50% { transform: translateY(-50px); }
                100% { transform: translateY(0); }
            }
        </style>`;
    </script>

    <!-- Show/Hide Sections -->
    <script>
        function showSection(id) {
            const sections = document.querySelectorAll('.section');
            sections.forEach(sec => sec.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    <script>
const music = document.getElementById("bgmusic");

function startMusic() {
    music.play();
    document.removeEventListener("click", startMusic);
    document.removeEventListener("scroll", startMusic);
}

// Start music on first interaction
document.addEventListener("click", startMusic);
document.addEventListener("scroll", startMusic);
</script>

</body>
</html>
