<!DOCTYPE html>
<html>
<head>
    <title>🎁 Secret Birthday Surprise</title>
    <style>
        body { font-family: Arial; text-align: center; background: #222; color: white; }
        h1 { margin-top: 50px; }
        input { padding: 10px; margin-top: 20px; }
        button { padding: 10px 20px; margin-top: 10px; cursor: pointer; }
        a { color: pink; display: block; margin-top: 30px; text-decoration: none; }
    </style>
</head>
<body>
    <h1>🎁 Enter the secret code</h1>
    <input type="password" id="code" placeholder="Enter code">
    <br>
    <button onclick="checkCode()">Unlock 🎉</button>
    <p id="msg"></p>
    <a href="main.html">⬅ Back to main page</a>

    <script>
        function checkCode() {
            let code = document.getElementById('code').value;
            if(code === "swme") {
                alert("🎉 You unlocked the surprise! 🎉");
                document.getElementById('msg').innerText = "🎊 Happy Birthday! 🎊";
            } else {
                alert("❌ Wrong code! Try again.");
            }
        }
    </script>
</body>
</html>
